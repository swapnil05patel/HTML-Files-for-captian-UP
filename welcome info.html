<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Terms and Conditions</title>
  <style>
    /* Base Styling */
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    /* Container for content */
    .container {
      max-width: 650px;
      width: 100%;
      background: #161623;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    /* Heading Variation */
    .sw-new-heading {
      position: relative;
      font-size: 2.2rem;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding-bottom: 12px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .sw-new-heading::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 0;
      width: 40%;
      height: 4px;
      background: linear-gradient(90deg, #ff416c, #ff4b2b);
      border-radius: 2px;
    }

    /* Terms Box Scrollbar styling */
    .terms-box {
      max-height: 300px;
      overflow-y: auto;
      background: #0f0f1a;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #2a2a40;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .terms-box::-webkit-scrollbar {
      width: 8px;
    }

    .terms-box::-webkit-scrollbar-thumb {
      background: #2a2a40;
      border-radius: 4px;
    }

    .terms-box h2 {
      font-size: 1.1rem;
      color: #ff416c;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .terms-box h2:first-child {
      margin-top: 0;
    }

    .terms-box p {
      margin: 0 0 12px 0;
      color: #b5b5c3;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 class="sw-new-heading">Welcome to Mega Betting Tournament</h1>


    </div>
  </div>

</body>

</html>
